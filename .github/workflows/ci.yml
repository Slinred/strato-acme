name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  verify-code-quality:
    name: Verify code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Verify code quality with pre-commit
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --config .pre-commit-config.yaml --all-files --show-diff-on-failure

  build-python-package:
    name: Build python package
    runs-on: ubuntu-latest
    needs: verify-code-quality
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: |
          just setup-python

      - name: Build & check package
        run: |
          just build-python-dev

  generate-unreleased-changelog:
    name: Generate unreleased changelog
    runs-on: ubuntu-latest
    needs: verify-code-quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate changelog (unreleased)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --output CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: unreleased-changelog
          path: CHANGELOG.md

  build-docker-image:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: verify-code-quality
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: docker buildx setup
        uses: docker/setup-buildx-action@v3.10.0

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Build the docker image
        env:
          DOCKERHUB_LOGIN: ${{ vars.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF}" == "refs/heads/main" ]; then
            echo "Docker image will be pushed to DockerHub as commit ${GITHUB_SHA:0:8}"
            echo $DOCKERHUB_TOKEN | docker login -u "$DOCKERHUB_LOGIN" --password-stdin
            just build-docker-release
          else
            just build-docker-dev
          fi

          docker logout || true
