name: Release
on:
  push:
    tags:
      - "*.*.*"

jobs:
  check-changes:
    name: Check package changes
    runs-on: ubuntu-latest
    outputs:
      python-package-changed: ${{ steps.changes.outputs.python-package-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect package file changes since last tag
        id: changes
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, assuming package changed"
            echo "python-package-changed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "${PREV_TAG}...${CURRENT_TAG}" -- src/ pyproject.toml uv.lock)
            if [ -n "$CHANGED" ]; then
              echo "Package files changed since $PREV_TAG:"$'\n'"$CHANGED"
              echo "python-package-changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No package files changed since $PREV_TAG, skipping PyPI publish"
              echo "python-package-changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  release-pypi:
    name: Release package to PyPI
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.python-package-changed == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/strato-dns-api/
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: latest

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: |
          just setup-python

      - name: Build & check package
        run: |
          just build-python-release

      - name: publish
        # gh-action-pypi-publish uses TWINE_PASSWORD automatically
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  release-docker:
    name: Release docker image to DockerHub
    runs-on: ubuntu-latest
    environment:
      name: DockerHub
      url: https://hub.docker.com/repository/docker/slinred/strato-acme/general
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: docker buildx setup
        uses: docker/setup-buildx-action@v4

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Tag and push docker image
        env:
          DOCKERHUB_LOGIN: ${{ vars.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo $DOCKERHUB_TOKEN | docker login -u "$DOCKERHUB_LOGIN" --password-stdin
          just push-docker-release

          docker logout || true # Ignore logout failure, e.g. if login was not successful

  release-github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-pypi, release-docker]
    if: always() && !failure() && !cancelled()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download dist artifacts
        if: needs.release-pypi.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Generate release notes (latest tag)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --output release-notes.md

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
          files: |
            CHANGELOG.md
            dist/*
            src/acme_plugin/dns_strato.sh
