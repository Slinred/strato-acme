name: Release
on:
  push:
    tags:
      - "*.*.*"

jobs:
  release-pypi:
    name: Release package to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/strato-dns-api/
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: |
          just setup-python

      - name: Build & check package
        run: |
          just build-python-release

      - name: publish
        # gh-action-pypi-publish uses TWINE_PASSWORD automatically
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  release-docker:
    name: Release docker image to DockerHub
    runs-on: ubuntu-latest
    environment:
      name: DockerHub
      url: https://hub.docker.com/repository/docker/slinred/strato-acme/general
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: docker buildx setup
        uses: docker/setup-buildx-action@v3.10.0

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Tag and push docker image
        env:
          DOCKERHUB_LOGIN: ${{ vars.DOCKERHUB_LOGIN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo $DOCKERHUB_TOKEN | docker login -u "$DOCKERHUB_LOGIN" --password-stdin
          just push-docker-release

          docker logout || true # Ignore logout failure, e.g. if login was not successful

  release-github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-pypi, release-docker]
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Get changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF:#refs/tags/}
          uv run ./scripts/version_changelog.py ${VERSION} > version_changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${GITHUB_REF:#refs/tags/}
          name: Release ${GITHUB_REF:#refs/tags/}
          body_path: version_changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
          files: |
            dist/*
            src/acme_plugin/dns_strato.sh
